name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'apps/streamer/**'
      - 'apps/metrics/**'
      - 'packages/**'
      - 'infra/**'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false


permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Backend Infrastructure to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          envs: GITHUB_TOKEN,GITHUB_REPO
          script: |
            set -e
            echo "🚀 [1/5] Setting up environment paths..."
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:~/.local/share/pnpm:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "📥 [2/5] Syncing latest code on EC2..."
            mkdir -p $HOME/nimbus_ci
            cd $HOME/nimbus_ci

            if [ ! -d ".git" ]; then
              echo "Initializing git repository in existing folder..."
              git init
            fi

            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git 2>/dev/null || git remote add origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git
            git fetch origin main
            git reset --hard origin/main

            echo "📦 [3/5] Installing dependencies & syncing database..."
            pnpm install --frozen-lockfile
            pnpm --filter @nimbus-ci/db run db:generate
            pnpm --filter @nimbus-ci/db run db:push

            echo "🔄 [4/5] Restarting microservices..."
            if command -v kubectl &> /dev/null && kubectl cluster-info &> /dev/null; then
              echo "Applying Kubernetes manifests via K3s..."
              kubectl apply -f infra/k8s/
              kubectl rollout restart deployment nimbus-worker || true
            elif command -v docker &> /dev/null; then
              echo "Rebuilding and starting Docker Compose services..."
              docker compose -f infra/docker-compose.yaml up -d --build --remove-orphans
              docker image prune -f || true
            fi

            echo "✅ [5/5] Deployment completed successfully!"
            docker ps
