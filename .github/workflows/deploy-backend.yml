name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'apps/streamer/**'
      - 'apps/metrics/**'
      - 'packages/**'
      - 'infra/**'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false


jobs:
  deploy:
    name: Deploy Backend Infrastructure to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          envs: GITHUB_REPOSITORY
          script: |
            set -e
            echo "🚀 [1/5] Setting up environment paths..."
            export PATH="$PATH:/usr/local/bin:/usr/bin:/bin:$HOME/.local/share/pnpm"

            echo "📥 [2/5] Syncing latest code on EC2..."
            mkdir -p $HOME/nimbus_ci
            cd $HOME/nimbus_ci

            if [ ! -d ".git" ]; then
              echo "Initializing git repository in existing folder..."
              git init
              git remote add origin https://github.com/${{ github.repository }}.git
            fi

            git remote set-url origin https://github.com/${{ github.repository }}.git
            git fetch origin main
            git reset --hard origin/main

            echo "📦 [3/5] Installing dependencies & syncing database..."
            pnpm install --frozen-lockfile
            pnpm --filter @nimbus-ci/db run db:generate
            pnpm --filter @nimbus-ci/db run db:push

            echo "🔄 [4/5] Restarting microservices..."
            if command -v kubectl >/dev/null 2>&1 && kubectl cluster-info >/dev/null 2>&1; then
              echo "Applying Kubernetes manifests via K3s..."
              kubectl apply -f infra/k8s/
              kubectl rollout restart deployment nimbus-worker || true
            elif command -v docker >/dev/null 2>&1; then
              echo "Rebuilding and starting Docker Compose services..."
              docker compose -f infra/docker-compose.yaml up -d --build --remove-orphans
              docker image prune -f || true
            fi

            echo "✅ [5/5] Deployment completed successfully!"
            docker ps
