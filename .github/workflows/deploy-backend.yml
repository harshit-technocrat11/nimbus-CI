name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'apps/streamer/**'
      - 'apps/metrics/**'
      - 'packages/**'
      - 'infra/**'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false


jobs:
  deploy:
    name: Deploy Backend Infrastructure to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            echo "🚀 [1/5] Setting up environment paths..."
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.local/share/pnpm:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "📥 [2/5] Pulling latest code on EC2..."
            if [ ! -d "$HOME/nimbus_ci/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git $HOME/nimbus_ci
            fi
            cd $HOME/nimbus_ci
            git fetch --all
            git reset --hard origin/main

            echo "📦 [3/5] Installing dependencies & syncing database..."
            pnpm install --frozen-lockfile
            pnpm --filter @nimbus-ci/db run db:generate
            pnpm --filter @nimbus-ci/db run db:push

            echo "🔄 [4/5] Restarting microservices..."
            if command -v kubectl &> /dev/null && kubectl cluster-info &> /dev/null; then
              echo "Applying Kubernetes manifests via K3s..."
              kubectl apply -f infra/k8s/
              kubectl rollout restart deployment nimbus-worker || true
            elif command -v docker &> /dev/null; then
              echo "Rebuilding and starting Docker Compose services..."
              docker compose -f infra/docker-compose.yaml up -d --build --remove-orphans
              docker image prune -f || true
            fi

            echo "✅ [5/5] Deployment completed successfully!"
            docker ps
