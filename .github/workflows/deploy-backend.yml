name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'apps/streamer/**'
      - 'apps/metrics/**'
      - 'packages/**'
      - 'infra/**'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'package.json'
      - '.npmrc'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false


permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Backend Infrastructure to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          envs: GITHUB_TOKEN,GITHUB_REPO
          script: |
            set -e
            echo "🚀 [1/5] Setting up environment paths..."
            export PATH="/usr/local/bin:/usr/bin:/bin:$HOME/.local/share/pnpm:$PATH"
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            echo "📥 [2/5] Syncing latest code on EC2..."
            mkdir -p $HOME/nimbus_ci
            cd $HOME/nimbus_ci

            if [ ! -d ".git" ]; then
              echo "Initializing git repository in existing folder..."
              git init
            fi

            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git 2>/dev/null || git remote add origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git
            git fetch origin main
            git reset --hard origin/main

            echo "📦 [3/5] Installing dependencies & syncing database..."
            if ! command -v python3 >/dev/null 2>&1 || ! command -v make >/dev/null 2>&1 || ! command -v g++ >/dev/null 2>&1; then
              echo "🛠️ Installing native build prerequisites (python3, python3-dev, make, g++, build-essential)..."
              sudo apt-get update -qq
              sudo apt-get install -y -qq python3 python3-dev make g++ build-essential
            fi

            export PYTHON="$(command -v python3)"
            export npm_config_python="$PYTHON"

            command -v python3 >/dev/null 2>&1 || { echo "❌ python3 is required"; exit 1; }
            command -v g++ >/dev/null 2>&1 || { echo "❌ g++ is required"; exit 1; }
            command -v make >/dev/null 2>&1 || { echo "❌ make is required"; exit 1; }

            pnpm install --frozen-lockfile --ignore-scripts=false
            pnpm --filter @nimbus-ci/db run db:generate
            pnpm --filter @nimbus-ci/db run db:push

            echo "🔄 [4/5] Building & deploying microservices..."
            if command -v kubectl >/dev/null 2>&1 && kubectl cluster-info >/dev/null 2>&1; then
              echo "🔨 Building Docker images and importing into K3s containerd..."
              for svc in api worker streamer metrics; do
                echo "📦 Processing nimbus-$svc..."
                docker build -t nimbus-ci-$svc:latest -f infra/docker/Dockerfile.$svc .
                docker save nimbus-ci-$svc:latest | sudo k3s ctr -n k8s.io images import -
              done

              echo "🚀 Applying Kubernetes manifests..."
              kubectl apply -f infra/k8s/
              kubectl rollout restart deployment nimbus-api nimbus-worker nimbus-streamer nimbus-metrics || true
            elif command -v docker >/dev/null 2>&1; then
              echo "Rebuilding and starting Docker Compose services..."
              docker compose -f infra/docker-compose.yaml up -d --build --remove-orphans
              docker image prune -f || true
            fi

            echo "✅ [5/5] Deployment completed successfully!"
            if command -v kubectl >/dev/null 2>&1 && kubectl cluster-info >/dev/null 2>&1; then
              kubectl get pods -o wide
            else
              docker ps
            fi
