services:
  redis:
    image: redis:7-alpine
    container_name: mini-git-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory-policy noeviction

  postgres:
    image: postgres:17-alpine
    container_name: mini-git-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mini_git_actions
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  worker:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    container_name: nimbus-ci-worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DOCKER_SOCKET=/var/run/docker.sock
      - WORKSPACE_ROOT=/app/apps/worker/workspaces
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../apps/worker/workspaces:/app/apps/worker/workspaces
    depends_on:
      - redis

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    container_name: nimbus-ci-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8000:8000"
    depends_on:
      - redis

  streamer:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.streamer
    container_name: nimbus-ci-streamer
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - PORT=8001
    ports:
      - "8001:8001"

  metrics:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.metrics
    container_name: nimbus-ci-metrics
    restart: unless-stopped
    environment:
      - PORT=9090
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "9090:9090"
    depends_on:
      - redis

volumes:
  redis_data:
  postgres_data: