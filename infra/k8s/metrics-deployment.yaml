apiVersion: apps/v1
kind: Deployment
metadata:
  name: nimbus-metrics
  labels:
    app: nimbus-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nimbus-metrics
  template:
    metadata:
      labels:
        app: nimbus-metrics
    spec:
      containers:
        - name: metrics
          image: nimbus-ci-metrics:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-metrics
              containerPort: 9090
          env:
            - name: PORT
              value: "9090"
            - name: REDIS_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: REDIS_PORT
              value: "6379"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nimbus-metrics
  labels:
    app: nimbus-metrics
spec:
  type: ClusterIP
  selector:
    app: nimbus-metrics
  ports:
    - name: http-metrics
      port: 9090
      targetPort: 9090
