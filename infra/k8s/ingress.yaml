apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nimbus-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - nimbus-backend-harshit.duckdns.org
      secretName: nimbus-tls
  rules:
    - host: nimbus-backend-harshit.duckdns.org
      http:
        paths:
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: nimbus-api
                port:
                  number: 8000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: nimbus-api
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: nimbus-streamer
                port:
                  number: 8001
