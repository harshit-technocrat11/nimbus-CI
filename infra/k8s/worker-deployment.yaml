apiVersion: apps/v1
kind: Deployment

metadata:
  name: nimbus-worker
  labels:
    app: nimbus-worker

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nimbus-worker

  template:
    metadata:
      labels:
        app: nimbus-worker

    spec:
      containers:

        # =========================================
        # Nimbus Worker
        # =========================================
        - name: worker
          image: nimbus-ci-worker:latest
          imagePullPolicy: IfNotPresent

          env:
            - name: REDIS_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP

            - name: REDIS_PORT
              value: "6379"

            # Connect to Docker-in-Docker sidecar
            - name: DOCKER_HOST
              value: "tcp://localhost:2375"

            # Pod-local workspace
            - name: WORKSPACE_ROOT
              value: "/workspaces"

          volumeMounts:
            - name: workspace
              mountPath: /workspaces

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "1000m"
              memory: "1Gi"

        # =========================================
        # Docker-in-Docker
        # =========================================
        - name: docker
          image: docker:27-dind

          securityContext:
            privileged: true

          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""

          args:
            - "--host=tcp://0.0.0.0:2375"
            - "--host=unix:///var/run/docker.sock"

          volumeMounts:
            - name: workspace
              mountPath: /workspaces

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "1000m"
              memory: "1Gi"

      # =========================================
      # Pod-local temporary workspace
      # =========================================
      volumes:
        - name: workspace
          emptyDir: {}